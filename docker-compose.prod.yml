# docker-compose.prod.yml

services:
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile.prod  # Dockerfile.prod 파일을 사용하여 빌드
    expose:
      - "8000"
    env_file:
      - ./src/.env  # .env 파일 경로를 src 폴더 내로 지정
    environment:
      - POSTGRES_DB=oz_main
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: oz_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./resources/nginx/prod-nginx.conf:/etc/nginx/conf.d/default.conf  # 배포용 Nginx 설정 파일 연결
    depends_on:
      - django_gunicorn

volumes:
  postgres_data:
